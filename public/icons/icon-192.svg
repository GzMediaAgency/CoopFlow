<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="forestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#123f38" />
      <stop offset="60%" stop-color="#1b5a4b" />
      <stop offset="100%" stop-color="#545631" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Fond vert forêt ALAMIBUSINESS -->
  <rect width="192" height="192" rx="42" fill="url(#forestGrad)" />
  
  <!-- Anneau doré subtil -->
  <rect x="4" y="4" width="184" height="184" rx="38" fill="none" stroke="#f4c45e" stroke-width="2" stroke-opacity="0.3" />
  
  <!-- Symbole Germination / Terroir Argan or -->
  <g transform="translate(40, 36) scale(4.7)" filter="url(#shadow)">
    <!-- Lucide Sprout icon vectorisé -->
    <path d="M7 20h10" fill="none" stroke="#f4c45e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M10 20c5.5-2.5.8-6.4 3-10" fill="none" stroke="#f4c45e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z" fill="#f4c45e" stroke="#f4c45e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z" fill="#f4c45e" stroke="#f4c45e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>

