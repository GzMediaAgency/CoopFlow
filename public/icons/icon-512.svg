<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="forestGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#123f38" />
      <stop offset="50%" stop-color="#1b5a4b" />
      <stop offset="100%" stop-color="#545631" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf1d3" />
      <stop offset="40%" stop-color="#f4c45e" />
      <stop offset="100%" stop-color="#a67c26" />
    </linearGradient>
    <filter id="shadow512" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Fond vert forêt ALAMIBUSINESS -->
  <rect width="512" height="512" rx="112" fill="url(#forestGrad512)" />
  
  <!-- Anneau doré extérieur -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.35" />
  
  <!-- Symbole Germination / Terroir Argan or -->
  <g transform="translate(106, 96) scale(12.5)" filter="url(#shadow512)">
